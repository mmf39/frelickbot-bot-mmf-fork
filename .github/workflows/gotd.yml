name: Post Game of the Day

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  post-gotd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post GOTD
        env:
          REAL_SESSION_JSON: ${{ secrets.REAL_SESSION_JSON }}
          REAL_GROUP_ID: ${{ secrets.REAL_GROUP_ID }}
          REAL_TURNSTILE_TOKEN: ${{ secrets.REAL_TURNSTILE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          LEAGUE_SPREADSHEET_ID: ${{ secrets.LEAGUE_SPREADSHEET_ID }}
        run: python -m frelickbot.jobs gotd
